name: Orbit CI & Production Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  NODE_ENV: test

jobs:
  test-and-build:
    name: Test, Typecheck & Build Next.js 15
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run Unit & Firestore Security Rules Tests
        run: npx --yes tsx --test lib/orbit-logic.test.ts firestore.rules.test.ts

      - name: Build Production Next.js Bundle
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          APP_URL: ${{ secrets.APP_URL || 'http://localhost:3000' }}
        run: npm run build
